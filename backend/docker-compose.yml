# AI Doktor Asistanı — backend (bağımsız kompozisyon).
# Kullanım, backend/ içinden:  docker compose up -d --build
# .env doldurulmuş olmalı (bkz. .env.example).
#
# Frontend AYRI kompozisyondadır ve bu servise ağ üzerinden bağlanmaz;
# tarayıcı API'ye kendi alan adından doğrudan gelir. Bu yüzden .env'de
# FRONTEND_URL dolu olmalı, yoksa CORS herkese açık kalır.
#
# Sunucudaki ters vekil:  doctor-assistant-api.aisli.dev  ->  host 8003
# (8000 ve 8001 aurelia'ya, 8002 bu projenin frontend'ine ait.)

services:
  backend:
    build: .
    container_name: ai-doctor-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${AI_DOCTOR_BACKEND_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
