# AI Doktor Asistanı — backend (bağımsız kompozisyon).
# Kullanım, backend/ içinden:  docker compose up -d --build
# .env doldurulmuş olmalı (bkz. .env.example).
#
# Frontend AYRI kompozisyondadır (../frontend/docker-compose.yml) ve bu servise
# ortak ağ üzerinden "backend" adıyla ulaşır.
# İlk kurulumda ortak ağı bir kez oluştur:  docker network create ai-doctor

services:
  backend:
    build: .
    container_name: ai-doctor-backend
    restart: unless-stopped
    env_file: .env
    # Ters vekil doğrudan bu porta bakacaksa diye açık; frontend nginx'i
    # ortak ağ üzerinden eriştiği için zorunlu değil.
    # Sunucuda 8000/8001 aurelia'ya, 8002 bu projenin frontend'ine ait.
    ports:
      - "${AI_DOCTOR_BACKEND_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      ai-doctor:
        aliases:
          - backend

networks:
  ai-doctor:
    external: true
