# AI Doktor Asistanı — frontend (bağımsız kompozisyon).
# Kullanım, frontend/ içinden:  docker compose up -d --build
#
# Backend'e hiçbir bağımlılığı yoktur: ne derler, ne başlatır, ne de ağına
# bağlanır. Tarayıcı API'ye VITE_API_BASE adresinden doğrudan gider.
#
# Sunucudaki ters vekil alan adlarını host portlarına sürer:
#   doctor-assistant.aisli.dev      ->  host 8002  (bu servis)
#   doctor-assistant-api.aisli.dev  ->  host 8003  (backend)
# (8000 ve 8001 aurelia'ya ait.)

services:
  frontend:
    build:
      context: .
      args:
        # Derlemeye gömülür; değişirse imaj YENİDEN DERLENMELİ.
        # Yerelde backend compose'u ile denemek için: http://localhost:8003
        VITE_API_BASE: ${VITE_API_BASE:-https://doctor-assistant-api.aisli.dev}
    container_name: ai-doctor-frontend
    restart: unless-stopped
    ports:
      - "${AI_DOCTOR_FRONTEND_PORT:-8002}:80"
