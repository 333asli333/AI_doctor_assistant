# AI Doktor Asistanı — frontend (bağımsız kompozisyon).
# Kullanım, frontend/ içinden:  docker compose up -d --build
#
# Backend'i ne derler ne başlatır; yalnız BACKEND_URL adresine (varsayılan
# ortak ağdaki "backend") proxy'ler. Backend kapalıyken de ayağa kalkar.
# İlk kurulumda ortak ağı bir kez oluştur:  docker network create ai-doctor
#
# Sunucudaki ters vekil alan adını host portuna sürer:
#   doctor-assistant.aisli.dev  ->  host 8002
# (8000 ve 8001 aurelia'ya ait.)

services:
  frontend:
    build:
      context: .
      args:
        # Boş: arayüz göreli yola gider, nginx yukarıda backend'e proxy'ler.
        # Ayrı bir API alan adı kullanılacaksa burayı doldur ve YENİDEN DERLE.
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: ai-doctor-frontend
    restart: unless-stopped
    ports:
      - "${AI_DOCTOR_FRONTEND_PORT:-8002}:80"
    networks:
      - ai-doctor

networks:
  ai-doctor:
    external: true
