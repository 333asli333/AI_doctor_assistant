# Frontend nginx'i: statik dosyaları servis eder, API isteklerini backend'e
# taşır. SSL'i sunucudaki ters vekil bitirdiği için burada yalnız 80 var.

server {
    listen 80;
    server_name _;

    # Backend adresi BACKEND_URL ortam değişkeninden gelir (Dockerfile bu dosyayı
    # nginx şablonu olarak kopyalar, açılışta envsubst doldurur). Sabit bir
    # upstream kullanılmıyor: nginx onu açılışta çözer ve backend henüz yoksa
    # çöker. Değişkenle proxy_pass adı istek anında Docker DNS'inden çözer;
    # backend kapalıysa yalnız o istekler 502 döner.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "${BACKEND_URL}";

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite dosya adlarına hash koyduğu için varlıklar uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ASLA önbelleklenmemeli; yoksa yeni sürüm yayınlansa bile
    # tarayıcı eski hash'lere işaret eden eski sayfada takılı kalır.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /chat {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM yanıtları uzun sürebilir; varsayılan 60sn yetmeyebiliyor.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
