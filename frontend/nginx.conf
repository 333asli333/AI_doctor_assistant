# Frontend nginx'i: yalnız derlenmiş statik dosyaları servis eder.
# Backend'e hiçbir bağımlılığı yoktur; tarayıcı API'ye VITE_API_BASE ile
# derlemeye gömülen adresten doğrudan gider. SSL'i sunucudaki ters vekil
# bitirdiği için burada yalnız 80 var.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite dosya adlarına hash koyduğu için varlıklar uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ASLA önbelleklenmemeli; yoksa yeni sürüm yayınlansa bile
    # tarayıcı eski hash'lere işaret eden eski sayfada takılı kalır.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
