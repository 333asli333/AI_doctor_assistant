# Frontend nginx'i: statik dosyaları servis eder, API isteklerini backend'e
# taşır. SSL'i sunucudaki ters vekil bitirdiği için burada yalnız 80 var.

upstream backend {
    # Ortak docker ağındaki backend servisi (bkz. docker-compose.yml).
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite dosya adlarına hash koyduğu için varlıklar uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ASLA önbelleklenmemeli; yoksa yeni sürüm yayınlansa bile
    # tarayıcı eski hash'lere işaret eden eski sayfada takılı kalır.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /chat {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM yanıtları uzun sürebilir; varsayılan 60sn yetmeyebiliyor.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Tek sayfa uygulaması: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
